<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sehawa Operasional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F1; --surface:#FFFFFF; --surface-2:#E4ECEA; --ink:#122B2C; --muted:#56696A; --line:#D0DBD9;
  --accent:#0B6B67; --accent-ink:#FFFFFF; --accent-soft:#D3EAE7;
  --personal:#2B5FC4; --corporate:#9A5418; --after:#23774A;
  --ok:#1D7641; --warn:#A35F00; --bad:#B02E26; --info:#2B5FC4; --violet:#6546BC; --neutral:#5E7172;
  --a-admin:#44576A; --a-teknisi:#A5520F; --a-customer:#0F6F86; --a-sistem:#23774A; --a-owner:#A22A63;
  --shadow:0 1px 2px rgba(18,43,44,.06),0 6px 20px rgba(18,43,44,.06);
  --r:10px;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1819; --surface:#152324; --surface-2:#1C2D2E; --ink:#E2ECEB; --muted:#91A5A5; --line:#2A3E3F;
    --accent:#3FB4AC; --accent-ink:#06201F; --accent-soft:#163A39;
    --personal:#7EA8F6; --corporate:#E3A269; --after:#6CC792;
    --ok:#5CC98A; --warn:#E6A83E; --bad:#F07C72; --info:#7EA8F6; --violet:#AB95F2; --neutral:#91A5A5;
    --a-admin:#9CB0C4; --a-teknisi:#EE9A55; --a-customer:#5EC3DA; --a-sistem:#6CC792; --a-owner:#EE82B4;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1819; --surface:#152324; --surface-2:#1C2D2E; --ink:#E2ECEB; --muted:#91A5A5; --line:#2A3E3F;
  --accent:#3FB4AC; --accent-ink:#06201F; --accent-soft:#163A39;
  --personal:#7EA8F6; --corporate:#E3A269; --after:#6CC792;
  --ok:#5CC98A; --warn:#E6A83E; --bad:#F07C72; --info:#7EA8F6; --violet:#AB95F2; --neutral:#91A5A5;
  --a-admin:#9CB0C4; --a-teknisi:#EE9A55; --a-customer:#5EC3DA; --a-sistem:#6CC792; --a-owner:#EE82B4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.mono{font-family:var(--mono);font-size:.9em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100dvh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.brand span{font-size:11.5px;color:var(--muted)}
.nav-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:14px 10px 4px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);font-weight:500;width:100%}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .badge{margin-left:auto}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.badge.soft{background:var(--surface-2);color:var(--muted)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px;flex-wrap:wrap}
.top .menu-btn{display:none}
.proto{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px dashed var(--warn);border-radius:6px;padding:2px 8px}
.role-wrap{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.content{padding:24px 28px 72px;display:grid;gap:18px;align-content:start;max-width:1320px;width:100%}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:50;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .top{padding:10px 16px}
  .top .menu-btn{display:inline-grid}
  .content{padding:18px 16px 72px}
}

/* primitives */
.page-head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.page-head .sub{color:var(--muted);margin-top:4px;max-width:70ch}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.card.flush{padding:0;gap:0}
.card h2{font-size:15px;font-weight:700}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.stack{display:grid;gap:18px;align-content:start;min-width:0}
@media (max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.lg{padding:12px 18px;font-size:15px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.pill{--c:var(--neutral);display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.t-ok{--c:var(--ok)}.t-warn{--c:var(--warn)}.t-bad{--c:var(--bad)}.t-info{--c:var(--info)}.t-violet{--c:var(--violet)}.t-neutral{--c:var(--neutral)}
.jalur{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
.j-personal{color:var(--personal)}.j-corporate{color:var(--corporate)}.j-after{color:var(--after)}
.actor{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;color:#fff;white-space:nowrap}
:root:not([data-theme="light"]) .actor{color:var(--surface)}
.actor{background:var(--c,var(--a-admin))}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);border:2px solid var(--surface);color:var(--ink)}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.divider{height:1px;background:var(--line)}
.empty{color:var(--muted);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:8px;text-align:center}

/* tabs, toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;width:260px;max-width:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tcount{font-size:11px;background:var(--surface-2);border-radius:9px;padding:0 7px;color:var(--muted)}

/* table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
td .t1{font-weight:600}
td .t2{color:var(--muted);font-size:12.5px}
td.r,th.r{text-align:right}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.alert{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.kpi.alert .v{color:var(--bad)}

/* todo list */
.todo{display:grid}
.todo-i{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.todo-i:last-child{border-bottom:0}
.todo-i .bar{align-self:stretch;border-radius:3px;background:var(--c)}
.todo-i .tt{font-weight:600}
.todo-i .mm{color:var(--muted);font-size:12.5px}

/* agenda */
.agenda{display:grid;gap:8px}
.ag{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--surface-2);cursor:pointer;border:0;text-align:left;width:100%}
.ag:hover{outline:1px solid var(--accent)}
.ag .jam{font-family:var(--mono);font-weight:500}

/* stepper */
.stepper{display:flex;gap:0;list-style:none;margin:0;padding:0;flex-wrap:wrap;row-gap:10px}
.stepper li{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.stepper li+li::before{content:"";width:26px;height:2px;background:var(--line);margin:0 8px}
.stepper .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;background:var(--surface)}
.stepper li.done{color:var(--ink)}
.stepper li.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper li.on{color:var(--accent)}
.stepper li.on .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stepper li.fail{color:var(--bad)}
.stepper li.fail .dot{border-color:var(--bad);background:var(--bad);color:#fff}

/* callouts */
.note{display:flex;gap:10px;padding:11px 13px;border-radius:8px;background:color-mix(in srgb,var(--c,var(--info)) 10%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--info)) 30%,transparent);font-size:13px;align-items:flex-start}
.note svg{flex:none;color:var(--c,var(--info));margin-top:1px}
.note.warn{--c:var(--warn)}.note.bad{--c:var(--bad)}.note.ok{--c:var(--ok)}
.open{border:1.5px dashed color-mix(in srgb,var(--violet) 55%,var(--line));border-radius:9px;padding:11px 13px;display:grid;gap:4px;font-size:13px;background:color-mix(in srgb,var(--violet) 5%,transparent)}
.open-tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);margin-right:6px}
.open-a{color:var(--muted);font-size:12.5px}

/* forms */
.form{display:grid;gap:14px}
.field{display:grid;gap:5px}
.flabel{font-size:12.5px;font-weight:600;color:var(--muted)}
.fhint{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;min-width:0}
textarea.input{min-height:78px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.check b{display:block;font-size:13.5px}
.check span{font-size:12.5px;color:var(--muted)}
.check.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.tpick{display:grid;gap:6px}
.form-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}

/* modal */
.mback{position:fixed;inset:0;background:rgba(8,20,20,.45);z-index:60;display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);display:grid;max-height:calc(100dvh - 32px);grid-template-rows:auto minmax(0,1fr)}
.modal.wide{width:min(720px,100%)}
.mhead{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:16px;font-weight:700}
.mhead .icon-btn{margin-left:auto}
.mbody{padding:18px;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:70;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.ph{aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;position:relative;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .cap{position:absolute;inset:auto 0 0 0;font-size:10.5px;padding:3px 6px;background:color-mix(in srgb,var(--surface) 85%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.ph-fake{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 28%,var(--surface-2)),var(--surface-2));color:var(--muted)}
.upl{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;align-content:center;gap:4px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;text-align:center;padding:6px}
.upl:hover{border-color:var(--accent);color:var(--accent)}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.file-chip{display:inline-flex;gap:8px;align-items:center;padding:7px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--surface-2)}

/* flow page */
.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:1000px){.lanes{grid-template-columns:1fr}}
.lane{border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:18px;display:grid;gap:10px;border-top:4px solid var(--lc)}
.lane-h{display:grid;gap:4px}
.lane-h h2{font-size:18px;font-weight:800;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lane-h p{color:var(--muted);font-size:13px}
.flow{display:grid;gap:0;list-style:none;margin:0;padding:0}
.fstep{position:relative;padding:0 0 14px 26px}
.fstep::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:color-mix(in srgb,var(--lc) 35%,var(--line))}
.fstep:last-child::before{display:none}
.fstep::after{content:"";position:absolute;left:3px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--lc)}
.fstep.dec::after{border-radius:2px;transform:rotate(45deg);border-color:var(--warn);background:var(--warn)}
.fbox{display:grid;gap:5px}
.fline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fline .tx{font-weight:600}
.fnote{font-size:12.5px;color:var(--muted)}
.fgo{border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;cursor:pointer;padding:0;justify-self:start}
.fgo:hover{text-decoration:underline}
.decision{font-size:13px;color:var(--warn);font-weight:600}
.after-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:1000px){.after-grid{grid-template-columns:1fr}}
.after-col{display:grid;gap:10px;align-content:start}
.after-col h3{font-size:14px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* calendar */
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:150px repeat(7,minmax(128px,1fr));min-width:1060px}
.cal .hd{padding:10px;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.cal .hd.today{color:var(--accent)}
.cal .who{padding:12px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;font-weight:600}
.cal .cell{padding:6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);display:grid;gap:5px;align-content:start;min-height:84px}
.cal .cell.today{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.cal .cell.clash{background:color-mix(in srgb,var(--bad) 7%,transparent)}
.ev{border:0;text-align:left;border-radius:6px;padding:5px 7px;font-size:12px;cursor:pointer;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-left:3px solid var(--c);display:grid;gap:1px;color:var(--ink);width:100%}
.ev b{font-family:var(--mono);font-weight:500;font-size:11px}
.ev.faded{opacity:.5}

/* teknisi mobile view */

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const T0=new Date();T0.setHours(0,0,0,0);
const T=iso(T0);
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const D=n=>addDays(T,n);
const diff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const fd=s=>{if(!s)return '—';const d=new Date(s+'T00:00:00');return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()};
const fds=s=>{if(!s)return '—';const d=new Date(s+'T00:00:00');return HR[d.getDay()]+', '+d.getDate()+' '+BLN[d.getMonth()]};
const rel=s=>{if(!s)return '';const n=diff(T,s);if(n===0)return 'hari ini';if(n===1)return 'besok';if(n===-1)return 'kemarin';return n>0?n+' hari lagi':(-n)+' hari lalu'};
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const byId=(arr,id)=>arr.find(x=>x.id===id);
const nextId=(arr,prefix,w)=>{const n=Math.max(0,...arr.map(x=>parseInt(String(x.id).replace(/\D/g,''),10)||0))+1;return prefix+String(n).padStart(w,'0')};

function agendaFor(s,tid,day){
  const out=[];
  s.jobs.forEach(j=>{if(j.jadwal===day&&j.teknisi.includes(tid)&&j.status!=='batal'){const c=byId(s.customers,j.customerId);out.push({kind:'job',id:j.id,jam:j.jam,label:c.nama,sub:j.jenis,status:j.status,halangan:!!j.halangan})}
    if(j.status==='menunggu survey'&&j.survey&&j.survey.tgl===day&&j.survey.surveyor===tid){const c=byId(s.customers,j.customerId);out.push({kind:'jsurvey',id:j.id,jam:j.survey.jam||'10:00',label:c.nama,sub:'Survey tambah unit',status:'survey'})}});
  s.leads.forEach(l=>{if(l.status==='survey'&&l.survey&&l.survey.tgl===day&&l.survey.surveyor===tid)out.push({kind:'survey',id:l.id,jam:l.survey.jam||'10:00',label:l.nama,sub:'Survey lokasi',status:'survey'})});
  return out.sort((a,b)=>a.jam.localeCompare(b.jam));
}
const busyOn=(s,tid,day,exclude)=>agendaFor(s,tid,day).filter(x=>x.status!=='selesai'&&x.id!==exclude);

    catatan:v.catatan,unitIds:v.unitIds||[],sumber:meta.sumber||'lead',klaimId:meta.klaimId||null,gratis:false,
    survey:v.perluSurvey?{tgl:v.surveyTgl,jam:'10:00',surveyor:v.surveyor,hasil:''}:null,

    bayar:{status:'belum',dp:0,dibayar:[],ditagih:null,...(meta.bayar||{})}});
  return id;
}

    d.riwayat.push({id:nextId(d.riwayat,'R-',4),unitId:u.id,tgl:T,jenis:j.jenis,jobId:j.id,teknisi:names});
  });
  if(JENIS_GARANSI.includes(j.jenis)&&!j.klaimId)d.garansi.push({id:nextId(d.garansi,'G-',4),jobId:j.id,customerId:j.customerId,mulai:T,hari:j.garansiHari||90});
  if(j.klaimId){const k=byId(d.klaim,j.klaimId);if(k)k.status='selesai'}
  if(j.gratis)j.bayar.status='gratis';
  delete d.reminderLog[j.customerId];
}

function FakeQR(){
  const cells=useMemo(()=>{let x=20260720;const a=[];for(let i=0;i<441;i++){x=(x*1103515245+12345)&0x7fffffff;const r=Math.floor(i/21),c=i%21;const fin=(r<7&&c<7)||(r<7&&c>13)||(r>13&&c<7);let on;if(fin){const rr=r>13?r-14:r,cc=c>13?c-14:c;on=rr===0||rr===6||cc===0||cc===6||(rr>=2&&rr<=4&&cc>=2&&cc<=4)}else on=((x>>9)&1)===1;a.push(on)}return a},[]);
  return html`<div className="qr" role="img" aria-label="Contoh kode QRIS">${cells.map((on,i)=>html`<i key=${i} className=${on?'on':''}></i>`)}</div>`;
}

function Dashboard(){
  const {s,go,role}=useApp();
  const leadAktif=s.leads.filter(l=>!['deal','batal'].includes(l.status));
  const jobHari=s.jobs.filter(j=>j.status!=='batal'&&(j.jadwal===T||j.status==='proses'));
  const tagihan=s.jobs.filter(overdue24);
  const piutang=s.jobs.filter(isPiutangCorp);
  const klaimOpen=s.klaim.filter(k=>k.status!=='selesai');
  const rem=reminderUnits(s).filter(u=>!openJobFor(s,u.customerId));
  const remCust=[...new Set(rem.map(u=>u.customerId))];
  const todo=[];
  s.jobs.filter(j=>j.halangan).forEach(j=>todo.push({c:'var(--bad)',t:`Halangan di ${j.id} · perlu reschedule`,m:`${byId(s.customers,j.customerId).nama} · ${j.halangan.alasan}`,a:'Reschedule',go:['job-detail',j.id]}));
  tagihan.forEach(j=>todo.push({c:'var(--bad)',t:`Tagihan personal lewat 1×24 jam · ${rp(sisaBayar(j))}`,m:`${j.id} · ${byId(s.customers,j.customerId).nama} · selesai ${rel(j.selesaiAt)}`,a:'Buka',go:['job-detail',j.id]}));
  klaimOpen.filter(k=>k.status==='diajukan').forEach(k=>todo.push({c:'var(--warn)',t:'Klaim garansi baru perlu dijadwalkan cek',m:`${byId(s.customers,k.customerId).nama} · ${k.keluhan}`,a:'Tangani',go:['garansi']}));
  s.leads.filter(l=>l.status==='baru').forEach(l=>todo.push({c:'var(--info)',t:`Lead baru belum dikontak · ${l.nama}`,m:l.kebutuhan,a:'Hubungi',go:['lead-detail',l.id]}));
  s.leads.filter(l=>l.status==='dikontak'&&l.followups.length>=3).forEach(l=>todo.push({c:'var(--warn)',t:`${l.followups.length}× follow-up tanpa progres · ${l.nama}`,m:'Lanjutkan atau tandai batal (aturan #3 belum disepakati)',a:'Tinjau',go:['lead-detail',l.id]}));
  s.leads.filter(l=>l.status==='survey'&&l.survey&&l.survey.hasil).forEach(l=>todo.push({c:'var(--violet)',t:`Hasil survey masuk · ${l.nama}`,m:'Susun penawaran resmi',a:'Buka',go:['lead-detail',l.id]}));
  s.leads.filter(l=>l.status==='penawaran'&&l.penawaran&&l.penawaran.status==='disetujui').forEach(l=>todo.push({c:'var(--ok)',t:`Penawaran disetujui, menunggu DP · ${l.nama}`,m:rp(l.penawaran.nilai),a:'Catat DP',go:['lead-detail',l.id]}));
  s.leads.filter(l=>l.status==='deal'&&!l.jobId).forEach(l=>todo.push({c:'var(--ok)',t:`Deal · belum dibuat Customer + Job · ${l.nama}`,m:'Konversi lead dan assign teknisi',a:'Konversi',go:['lead-detail',l.id]}));
  s.jobs.filter(j=>j.status==='menunggu survey'&&j.survey&&j.survey.hasil).forEach(j=>todo.push({c:'var(--violet)',t:`Survey ${j.id} selesai · jadwalkan pengerjaan`,m:byId(s.customers,j.customerId).nama,a:'Jadwalkan',go:['job-detail',j.id]}));
  s.jobs.filter(j=>j.jalur==='corporate'&&j.status==='selesai'&&!j.bast).forEach(j=>todo.push({c:'var(--warn)',t:`BAST belum diunggah · ${j.id}`,m:'Syarat menagih pelunasan',a:'Buka',go:['job-detail',j.id]}));
  s.jobs.filter(j=>isPiutangCorp(j)&&j.bast&&!j.bayar.ditagih).forEach(j=>todo.push({c:'var(--ok)',t:`Siap ditagih pelunasan · ${j.id}`,m:`${byId(s.customers,j.customerId).nama} · sisa ${rp(sisaBayar(j))}`,a:'Tagih',go:['job-detail',j.id]}));

  const kpis=[

function OwnerPanel(){
  const {s}=useApp();
  const stages=['baru','dikontak','survey','penawaran','deal','batal'];
  const max=Math.max(1,...stages.map(st=>s.leads.filter(l=>l.status===st).length));
  const ym=T.slice(0,7);
  const masuk=s.jobs.flatMap(j=>j.bayar.dibayar).filter(p=>p.tgl.slice(0,7)===ym).reduce((a,p)=>a+p.nominal,0);
  const piutang=s.jobs.filter(j=>isTagihanPersonal(j)||isPiutangCorp(j)).reduce((a,j)=>a+sisaBayar(j),0);
  const deal=s.leads.filter(l=>l.status==='deal').length,batal=s.leads.filter(l=>l.status==='batal').length;
  const byJalur=['personal','corporate'].map(jl=>({jl,n:s.jobs.filter(j=>j.jalur===jl&&j.status==='selesai').length}));
  const col={baru:'var(--neutral)',dikontak:'var(--info)',survey:'var(--violet)',penawaran:'var(--warn)',deal:'var(--ok)',batal:'var(--bad)'};
  return html`<div className="grid3">
    <div className="card"><h2>Pipeline lead</h2><div className="bars">${stages.map(st=>{const n=s.leads.filter(l=>l.status===st).length;return html`<div key=${st} className="bar-r"><span>${cap(st)}</span><div className="bar-t"><div className="bar-f" style=${{width:(n/max*100)+'%','--c':col[st]}}></div></div><b className="num" style=${{textAlign:'right'}}>${n}</b></div>`})}</div>
      <p className="small muted">Konversi lead tertutup: ${deal+batal?Math.round(deal/(deal+batal)*100):0}% (${deal} deal, ${batal} batal)</p></div>

function leadNext(l){
  if(l.status==='baru')return 'Hubungi & kualifikasi';
  if(l.status==='dikontak')return (l.jalur==='corporate'||l.perluSurvey)?'Jadwalkan survey':(l.perluDP?'Catat DP':'Deal → buat job');
  if(l.status==='survey')return l.survey&&l.survey.hasil?'Kirim penawaran':'Survey '+fds(l.survey.tgl);
  if(l.status==='penawaran')return l.penawaran.status==='disetujui'?'Catat DP':'Menunggu keputusan ('+l.penawaran.status+')';
  if(l.status==='deal')return l.jobId?'Job '+l.jobId:'Konversi ke job';
  return l.alasanBatal||'—';
}

        <td className="r num">${l.followups.length}${l.status==='dikontak'&&l.followups.length>=3?html` <span title="Sudah 3× follow-up" style=${{color:'var(--warn)'}}>⚠</span>`:''}</td><td className="small">${leadNext(l)}</td><td className="small muted">${rel(l.created)}</td></tr>`)}
      ${!rows.length&&html`<tr><td colSpan="8"><div className="empty">Tidak ada lead di filter ini.</div></td></tr>`}</tbody></table></div></div>

  return html`<div className="form"><p>Keluhan disebabkan pemakaian, bukan pengerjaan. Job klaim diubah menjadi job perbaikan berbayar.</p><${Field} label="Biaya perbaikan (Rp)"><input className="input num" id="bb-n" value=${n} onChange=${e=>setN(e.target.value)}/><//>
    <${FormFoot} ok=${Number(n)>0} label="Jadikan berbayar" onSubmit=${()=>{act(d=>{byId(d.klaim,k.id).keputusan='berbayar';const y=byId(d.jobs,j.id);y.jenis='Perbaikan';y.gratis=false;y.nilai=Number(String(n).replace(/\D/g,''))},'Klaim dialihkan ke servis berbayar');closeModal()}}/></div>`;
}
function PaymentCard({j}){
  const {openModal,act}=useApp();
  const paid=j.bayar.dibayar;const isCorp=j.jalur==='corporate';
  let body;
  if(j.bayar.status==='gratis'||(j.gratis&&j.status!=='selesai'))body=html`<${Note} tone="ok" icon=${I.check}>Gratis. Klaim garansi valid (akibat pengerjaan).<//>`;
  else if(j.bayar.status==='lunas')body=html`<${Note} tone="ok" icon=${I.check}>Lunas. Mutasi sudah diverifikasi admin.<//>`;
  else if(j.klaimId&&!j.nilai)body=html`<p className="small muted">Menunggu hasil cek teknisi: gratis atau berbayar.</p>`;
  else if(!isCorp){
    body=j.status!=='selesai'?html`<p className="small muted">Jalur personal tanpa DP${j.bayar.dp?' (DP diaktifkan untuk job ini)':''}. Tagihan muncul setelah job selesai.</p>`
      :html`${overdue24(j)?html`<${Note} tone="bad" icon=${I.alert}>Belum dibayar lewat 1×24 jam sejak selesai. Masuk daftar tagihan admin.<//>`:html`<${Note} tone="warn">Menunggu transfer / QRIS dari customer.<//>`}
        <button className="btn primary" onClick=${()=>openModal({title:'Verifikasi mutasi',body:html`<${VerifyForm} id=${j.id}/>`})}>Verifikasi mutasi → Lunas</button>`;
  }else{
    if(j.status!=='selesai')body=html`<p className="small muted">Pelunasan ditagih setelah job selesai dan BAST ditandatangani.</p>`;
    else if(!j.bast)body=html`<${Note} tone="warn" icon=${I.alert}>Unggah BAST bertanda tangan dulu. BAST adalah syarat menagih pelunasan.<//>`;
    else if(!j.bayar.ditagih)body=html`<button className="btn primary" onClick=${()=>act(d=>{byId(d.jobs,j.id).bayar.ditagih=T},'Tagihan pelunasan tercatat terkirim')}>Tagih pelunasan</button>`;
    else body=html`<p className="small muted">Tagihan pelunasan dikirim ${fd(j.bayar.ditagih)} (${rel(j.bayar.ditagih)}). Tampil di daftar piutang owner sampai lunas.</p><button className="btn primary" onClick=${()=>openModal({title:'Verifikasi pelunasan',body:html`<${VerifyForm} id=${j.id}/>`})}>Verifikasi pelunasan → Lunas</button>`;
  }
  return html`<div className="card"><div className="card-h"><h2>Pembayaran</h2><div className="right"><${BayarPill} j=${j}/></div></div>
    <dl className="kv"><dt>Nilai job</dt><dd className="num"><b>${j.nilai?rp(j.nilai):'—'}</b></dd>${paid.map((p,i)=>html`<dt key=${'a'+i}>${p.jenis}</dt><dd key=${'b'+i} className="num">${rp(p.nominal)} <span className="muted small">· ${p.metode} · ${fd(p.tgl)}</span></dd>`)}${j.nilai>0&&!j.gratis?html`<dt>Sisa</dt><dd className="num">${rp(sisaBayar(j))}</dd>`:''}</dl>${body}</div>`;
}
function JobDetail({id}){
  const {s,act,go,openModal}=useApp();
  const j=byId(s.jobs,id);if(!j)return html`<p>Job tidak ditemukan.</p>`;
  const c=byId(s.customers,j.customerId);const units=unitsOfJob(s,j);const g=s.garansi.find(x=>x.jobId===j.id);const k=j.klaimId&&byId(s.klaim,j.klaimId);
  const M=(title,body,wide)=>()=>openModal({title,body,wide});
  const steps=[...(j.survey?['menunggu survey']:[]),'terjadwal','proses','selesai'];
  const canFinish=j.foto.length>0&&j.konfirmasi&&!(k&&!k.keputusan);
  const isInstall=['Instalasi','Tambah unit'].includes(j.jenis);
  let action;
  if(j.status==='menunggu survey')action=html`<dl className="kv"><dt>Survey</dt><dd>${fds(j.survey.tgl)} · ${tekName(s,j.survey.surveyor)}</dd><dt>Hasil</dt><dd>${j.survey.hasil||html`<span className="muted">Belum masuk</span>`}</dd></dl>
    <div className="row">${!j.survey.hasil&&html`<button className="btn" onClick=${M('Hasil survey',html`<${HasilSurveyForm} id=${id} isJob/>`)}>Isi hasil survey</button>`}<button className="btn primary" disabled=${!j.survey.hasil} onClick=${M('Jadwalkan pengerjaan',html`<${JadwalkanSetelahSurvey} id=${id}/>`)}>Survey selesai → jadwalkan</button></div>`;
  else if(j.status==='terjadwal')action=html`<p className="small muted">Teknisi mengubah status dari HP. Admin juga bisa mengubahnya berdasarkan laporan WA.</p><div className="row"><button className="btn primary" onClick=${()=>act(d=>{byId(d.jobs,id).status='proses'},'Status job: proses')}>Mulai pengerjaan</button><button className="btn" onClick=${M('Reschedule job',html`<${RescheduleForm} id=${id}/>`)}>Reschedule</button></div>`;
  else if(j.status==='proses')action=html`${!canFinish&&html`<${Note} tone="warn">Syarat selesai: minimal 1 foto bukti hasil${j.konfirmasi?'':' + konfirmasi customer'}${k&&!k.keputusan?' + keputusan klaim':''}.<//>`}
    <div className="row"><button className="btn primary" disabled=${!canFinish} onClick=${()=>act(d=>completeJob(d,byId(d.jobs,id)),JENIS_GARANSI.includes(j.jenis)&&!j.klaimId?'Job selesai. Garansi terbit otomatis':'Job selesai, riwayat servis tercatat')}>Tandai selesai</button><button className="btn" onClick=${M('Jadwal ulang / lanjut hari lain',html`<${RescheduleForm} id=${id}/>`)}>Lanjut hari lain</button></div>`;
  else action=html`<${Note} tone="ok" icon=${I.check}>Selesai ${fd(j.selesaiAt)}. ${g?'Garansi '+g.id+' terbit otomatis.':''}<//>`;
  return html`
    <${Back} to="job" label="Semua job"/>
    <${PageHead} title=${html`<span className="mono" style=${{fontWeight:500}}>${j.id}</span> ${c.nama}`} sub=${`${j.jenis} · ${j.jalur==='corporate'?'Corporate':'Personal'}${j.leadId?' · dari lead '+j.leadId:j.sumber==='repeat'?' · repeat order':j.sumber==='reminder'?' · dari reminder servis':j.sumber==='klaim'?' · klaim garansi':''}`} actions=${html`<${Pill} v=${j.status}/><${BayarPill} j=${j}/>`}/>
    ${j.halangan&&html`<${Note} tone="bad" icon=${I.alert}><b>Halangan dilaporkan ${tekName(s,j.halangan.oleh)} ${rel(j.halangan.tgl)}:</b> ${j.halangan.alasan}. ${j.halangan.catatan||''} <button className="btn sm" style=${{marginLeft:'6px'}} onClick=${M('Reschedule job',html`<${RescheduleForm} id=${id}/>`)}>Reschedule</button><//>`}
    <div className="grid2">
      <div className="stack">
        <div className="card"><${Stepper} steps=${steps} current=${j.status}/>${action}</div>
        ${k&&html`<div className="card"><div className="card-h"><h2>Klaim garansi ${k.id}</h2><div className="right"><${KlaimPill} k=${k}/></div></div><p>${k.keluhan}</p>${!k.keputusan?html`<p className="small muted">Keputusan setelah teknisi cek di lokasi:</p><${KeputusanKlaim} k=${k} j=${j}/><${Open} n=${2} assume="admin mencatat keputusan berdasarkan laporan teknisi."/>`:''}</div>`}
        <div className="card"><div className="card-h"><h2>Unit AC</h2>${isInstall&&j.rencanaUnit>0&&html`<span className="muted small num">${units.length} / ${j.rencanaUnit} rencana unit</span>`}<div className="right">${isInstall&&html`<button className="btn sm" onClick=${M('Input data unit AC',html`<${UnitForm} jobId=${id}/>`)}>${I.plus} Tambah unit</button>`}</div></div>
          ${isInstall&&j.rencanaUnit>0&&html`<div className="progress"><i style=${{width:Math.min(100,units.length/j.rencanaUnit*100)+'%'}}></i></div>`}
          ${units.length?html`<div className="table-wrap"><table><thead><tr><th>Merk / tipe</th><th>No. seri</th><th>Lokasi</th><th>Tgl pasang</th></tr></thead><tbody>${units.map(u=>html`<tr key=${u.id}><td>${u.merk} ${u.tipe}</td><td className="mono">${u.seri}</td><td>${u.lokasi}</td><td>${fd(u.tglPasang)}</td></tr>`)}</tbody></table></div>`:html`<div className="empty">${isInstall?'Belum ada unit. Data unit diinput admin dari laporan teknisi.':'Tidak ada unit terkait.'}</div>`}</div>
        <div className="card"><h2>Bukti pekerjaan</h2>
          <${PhotoUploader} id=${id} readOnly=${j.status==='selesai'}/>
          <${Check} id="jd-konf" checked=${j.konfirmasi} onChange=${x=>act(d=>{byId(d.jobs,id).konfirmasi=x})} title="Customer sudah konfirmasi hasil" desc="Customer mengecek unit menyala normal & area bersih"/>
          ${j.jalur==='corporate'&&html`<div className="field"><span className="flabel">BAST ditandatangani (template PDF, di-scan / difoto)</span><${BastUploader} id=${id}/></div>`}</div>
        ${j.reschedule.length>0&&html`<div className="card"><h2>Riwayat reschedule</h2><ul className="timeline">${j.reschedule.map((r,i)=>html`<li key=${i}><span className="d">${fd(r.tgl)}</span><span>${fds(r.dari)} → <b>${fds(r.ke)}</b> · ${r.alasan}</span></li>`)}</ul></div>`}
      </div>
      <div className="stack">
        <div className="card"><h2>Customer</h2><dl className="kv"><dt>Nama</dt><dd><button className="fgo" onClick=${()=>go('customer-detail',c.id)}>${c.nama}</button></dd>${c.pic?html`<dt>PIC</dt><dd>${c.pic}</dd>`:''}<dt>No. HP</dt><dd className="mono">${c.hp}</dd><dt>Alamat</dt><dd>${c.alamat}</dd></dl></div>
        <div className="card"><div className="card-h"><h2>Tim & jadwal</h2>${!['selesai','menunggu survey'].includes(j.status)&&html`<div className="right"><button className="btn sm" onClick=${M('Reschedule job',html`<${RescheduleForm} id=${id}/>`)}>Ubah</button></div>`}</div>
          <dl className="kv"><dt>Jadwal</dt><dd>${j.jadwal?fds(j.jadwal)+' · '+j.jam:'Setelah survey'}</dd><dt>Teknisi</dt><dd>${j.teknisi.length?j.teknisi.map(t=>tekName(s,t)).join(', '):'—'}</dd>${j.catatan?html`<dt>Catatan</dt><dd>${j.catatan}</dd>`:''}</dl></div>
        <${PaymentCard} j=${j}/>
        ${JENIS_GARANSI.includes(j.jenis)&&!j.klaimId&&html`<div className="card"><h2>Garansi</h2>${g?html`<dl className="kv"><dt>No.</dt><dd className="mono">${g.id}</dd><dt>Berlaku</dt><dd>${fd(g.mulai)} – ${fd(garansiEnd(g))}</dd><dt>Status</dt><dd>${garansiAktif(g)?html`<${Pill} v="aktif">Aktif · sisa ${diff(T,garansiEnd(g))} hari<//>`:html`<${Pill} v="berakhir"/>`}</dd></dl>`
          :html`<p className="small muted">Terbit otomatis saat job selesai.</p><${Field} label="Masa garansi (hari)" hint="Default 90 hari, bisa custom per job."><input className="input num" type="number" id="jd-gar" value=${j.garansiHari} onChange=${e=>act(d=>{byId(d.jobs,id).garansiHari=Number(e.target.value)||0})}/><//>`}</div>`}
      </div>
    </div>`;
}

/* ---------- Kalender ---------- */
function Kalender(){
  const {s,go,role,tekId}=useApp();const [off,setOff]=useState(0);
  const dow=(T0.getDay()+6)%7;const start=addDays(T,-dow+off*7);
  const days=[...Array(7)].map((_,i)=>addDays(start,i));
  const teks=role==='teknisi'?s.teknisi.filter(t=>t.id===tekId):s.teknisi;
  const colr={job:'var(--info)',survey:'var(--violet)',jsurvey:'var(--violet)'};
  const open=a=>{if(role==='teknisi')go(a.kind==='job'?'tugas-detail':'survey-detail',a.id);else go(a.kind==='survey'?'lead-detail':'job-detail',a.id)};
  return html`
    <${PageHead} title=${role==='teknisi'?'Kalender saya':'Kalender teknisi'} sub="Job dan survey berada di satu kalender. Sel merah menandai teknisi dengan lebih dari satu jadwal di hari yang sama." actions=${html`<button className="btn" onClick=${()=>setOff(off-1)}>${I.back}</button><button className="btn" onClick=${()=>setOff(0)}>Minggu ini</button><button className="btn" onClick=${()=>setOff(off+1)}>${I.chev}</button>`}/>
    <div className="legend"><span><span className="pill t-info">Job</span></span><span><span className="pill t-violet">Survey</span></span><span><span className="pill t-warn">Proses</span></span><span><span className="pill t-bad">Halangan</span></span><span className="muted">${fd(days[0])} – ${fd(days[6])}</span></div>
    <div className="card flush"><div className="cal-wrap"><div className="cal">
      <div className="hd">Teknisi</div>${days.map(d=>html`<div key=${d} className=${'hd'+(d===T?' today':'')}>${fds(d)}</div>`)}
      ${teks.map(t=>html`<${React.Fragment} key=${t.id}><div className="who"><${Av} s=${s} id=${t.id}/><div><div>${t.nama}</div><div className="small muted">${t.senior?'Senior · surveyor':'Teknisi'}</div></div></div>
        ${days.map(d=>{const it=agendaFor(s,t.id,d);const active=it.filter(x=>x.status!=='selesai');return html`<div key=${d} className=${'cell'+(d===T?' today':'')+(active.length>1?' clash':'')}>${it.map(a=>html`<button key=${a.id} className=${'ev'+(a.status==='selesai'?' faded':'')} style=${{'--c':a.halangan?'var(--bad)':a.status==='proses'?'var(--warn)':colr[a.kind]}} onClick=${()=>open(a)}><b>${a.jam} · ${a.kind==='job'?a.id:'Survey'}</b><span>${a.label}</span></button>`)}</div>`})}<//>`)}
    </div></div></div>`;
}

/* ---------- Tagihan & piutang ---------- */
function Tagihan(){
  const {s,go}=useApp();
  const personal=s.jobs.filter(isTagihanPersonal).sort((a,b)=>a.selesaiAt.localeCompare(b.selesaiAt));
  const corp=s.jobs.filter(isPiutangCorp);
  const dpAktif=s.jobs.filter(j=>j.jalur==='corporate'&&j.status!=='selesai'&&j.bayar.status==='dp');
  const tot=a=>a.reduce((x,j)=>x+sisaBayar(j),0);
  const row=(j,extra)=>{const c=byId(s.customers,j.customerId);return html`<tr key=${j.id} className="click" tabIndex="0" onClick=${()=>go('job-detail',j.id)} onKeyDown=${e=>e.key==='Enter'&&go('job-detail',j.id)}><td className="mono">${j.id}</td><td><div className="t1">${c.nama}</div><div className="t2 mono">${c.hp}</div></td>${extra}<td className="r num"><b>${rp(sisaBayar(j))}</b></td></tr>`};
  return html`
    <${PageHead} title="Tagihan & piutang" sub="Personal: tanpa DP, bayar penuh setelah selesai. Corporate: DP di depan, pelunasan ditagih setelah BAST."/>
    <div className="kpis"><div className="kpi alert"><span className="l">Tagihan personal</span><span className="v">${rp(tot(personal))}</span><span className="s">${personal.filter(overdue24).length} job lewat 1×24 jam</span></div><div className="kpi"><span className="l">Piutang corporate</span><span className="v">${rp(tot(corp))}</span><span className="s">${corp.length} job selesai, belum lunas</span></div><div className="kpi"><span className="l">Sisa kontrak berjalan</span><span className="v">${rp(tot(dpAktif))}</span><span className="s">${dpAktif.length} job corporate, DP sudah masuk</span></div></div>
    <div className="card flush"><div className="card" style=${{border:0}}><div className="card-h"><h2>Tagihan personal</h2><span className="muted small">Belum bayar > 1×24 jam masuk daftar ini</span></div></div>
      <div className="table-wrap"><table><thead><tr><th>Job</th><th>Customer</th><th>Selesai</th><th>Status</th><th className="r">Sisa</th></tr></thead><tbody>
      ${personal.map(j=>row(j,html`<td>${fd(j.selesaiAt)}<div className="t2">${rel(j.selesaiAt)}</div></td><td><${BayarPill} j=${j}/></td>`))}
      ${!personal.length&&html`<tr><td colSpan="5"><div className="empty">Tidak ada tagihan personal.</div></td></tr>`}</tbody></table></div></div>
    <${Open} n=${1} assume="tagihan tampil di sini tanpa batas waktu sampai lunas. Admin follow-up via WA."/>
    <div className="card flush"><div className="card" style=${{border:0}}><div className="card-h"><h2>Piutang corporate</h2><span className="muted small">Tampil juga di ringkasan owner</span></div></div>
      <div className="table-wrap"><table><thead><tr><th>Job</th><th>Customer</th><th>Nilai</th><th>BAST</th><th>Ditagih</th><th className="r">Sisa</th></tr></thead><tbody>
      ${corp.map(j=>row(j,html`<td className="num">${rp(j.nilai)}<div className="t2">DP ${rp(dibayar(j))}</div></td><td>${j.bast?html`<${Pill} tone="ok">Ada<//>`:html`<${Pill} tone="bad">Belum<//>`}</td><td>${j.bayar.ditagih?fd(j.bayar.ditagih):html`<span className="muted">Belum</span>`}</td>`))}
      ${!corp.length&&html`<tr><td colSpan="6"><div className="empty">Tidak ada piutang corporate.</div></td></tr>`}</tbody></table></div></div>`;
}

/* ---------- Customer & unit ---------- */

function Reminder(){
  const {s,act,go,openModal,closeModal,notify}=useApp();
  const units=reminderUnits(s);
  const groups=[...new Set(units.map(u=>u.customerId))].map(cid=>({c:byId(s.customers,cid),units:units.filter(u=>u.customerId===cid),open:openJobFor(s,cid),log:s.reminderLog[cid]}));
  const aktif=groups.filter(g=>!g.open&&!(g.log&&g.log.status==='ditolak'));
  const lain=groups.filter(g=>g.open||(g.log&&g.log.status==='ditolak'));
  const pesan=g=>`Halo ${g.c.nama}, ini Sehawa. AC ${g.units.map(u=>u.lokasi.toLowerCase()).join(' & ')} terakhir diservis ${diff(g.units[0].servisTerakhir,T)} hari lalu. Supaya tetap dingin & hemat listrik, kami sarankan cuci AC rutin tiap 3 bulan. Mau kami jadwalkan minggu ini?`;
  const buatJob=g=>openModal({title:'Customer setuju · buat job cuci AC',wide:true,body:html`<${JobForm} jenisOpts=${['Cuci AC','Servis']} unitsPick=${g.units} init=${{unitIds:g.units.map(u=>u.id),rencanaUnit:g.units.length,nilai:g.units.length*150000}} submitLabel="Buat job" onSubmit=${v=>{const jid=nextId(s.jobs,'J-',4);act(d=>createJob(d,v,{customerId:g.c.id,jalur:g.c.tipe,sumber:'reminder'}),`Job ${jid} dibuat dari reminder`);closeModal();go('job-detail',jid)}}/>`});
  return html`
    <${PageHead} title="Reminder servis rutin" sub="Sistem mendeteksi unit yang ±3 bulan belum diservis sejak dipasang atau servis terakhir. Admin menawarkan cuci / maintenance via WA."/>
    <${Open} n=${4} assume="interval 90 hari dari tanggal pasang / servis terakhir, dan admin yang mengeksekusi penawaran."/>
    <div className="grid2" style=${{gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))'}}>${aktif.map(g=>html`<div key=${g.c.id} className="card">
      <div className="card-h"><h2>${g.c.nama}</h2><${Jalur} j=${g.c.tipe}/><div className="right">${g.log?html`<${Pill} tone="info">Ditawarkan ${rel(g.log.tgl)}<//>`:html`<${Pill} tone="warn">Belum ditawarkan<//>`}</div></div>
      <ul className="timeline">${g.units.map(u=>html`<li key=${u.id}><span className="d" style=${{color:'var(--warn)'}}>${diff(u.servisTerakhir,T)} hari</span><span>${u.merk} ${u.tipe} · ${u.lokasi}</span></li>`)}</ul>
      <div className="note" style=${{fontSize:'12.5px'}}>${I.phone}<div style=${{userSelect:'all'}}>${pesan(g)}</div></div>
      <div className="row"><button className="btn sm" onClick=${()=>{copyText(pesan(g),notify);act(d=>{d.reminderLog[g.c.id]={status:'ditawarkan',tgl:T}})}}>${I.copy} Salin pesan & tandai ditawarkan</button></div>
      <div className="row"><button className="btn primary sm" onClick=${()=>buatJob(g)}>Setuju → buat job</button><button className="btn sm ghost" onClick=${()=>act(d=>{d.reminderLog[g.c.id]={status:'ditolak',tgl:T}},'Ditandai belum tertarik')}>Belum tertarik</button></div></div>`)}
      ${!aktif.length&&html`<div className="empty">Tidak ada unit yang jatuh tempo servis.</div>`}</div>
    ${lain.length>0&&html`<div className="card"><h2>Tidak perlu ditawarkan sekarang</h2>${lain.map(g=>html`<div key=${g.c.id} className="row" style=${{justifyContent:'space-between'}}><span><b>${g.c.nama}</b> · ${g.units.length} unit</span>${g.open?html`<button className="btn sm" onClick=${()=>go('job-detail',g.open.id)}>Sudah ada job ${g.open.id}</button>`:html`<span className="row"><span className="muted small">Belum tertarik (${fd(g.log.tgl)})</span><button className="btn sm ghost" onClick=${()=>act(d=>{delete d.reminderLog[g.c.id]})}>Aktifkan lagi</button></span>`}</div>`)}</div>`}`;

function TugasSaya(){
  const {s,go,tekId}=useApp();
  const mine=s.jobs.filter(j=>j.teknisi.includes(tekId));
  const today=mine.filter(j=>j.status==='proses'||(j.jadwal===T&&j.status==='terjadwal'));
  const next=mine.filter(j=>j.status==='terjadwal'&&j.jadwal>T).sort((a,b)=>a.jadwal.localeCompare(b.jadwal));
  const surveys=[...s.leads.filter(l=>l.status==='survey'&&l.survey&&l.survey.surveyor===tekId&&!l.survey.hasil).map(l=>({id:l.id,nama:l.nama,tgl:l.survey.tgl,jam:l.survey.jam,ket:l.kebutuhan,alamat:l.alamat})),
    ...s.jobs.filter(j=>j.status==='menunggu survey'&&j.survey&&j.survey.surveyor===tekId&&!j.survey.hasil).map(j=>{const c=byId(s.customers,j.customerId);return {id:j.id,nama:c.nama,tgl:j.survey.tgl,jam:j.survey.jam||'10:00',ket:j.catatan,alamat:c.alamat}})];
  const done=mine.filter(j=>j.status==='selesai'&&diff(j.selesaiAt,T)<=7);
  const card=j=>{const c=byId(s.customers,j.customerId);return html`<button key=${j.id} className="tk-card" onClick=${()=>go('tugas-detail',j.id)}><div className="h"><span className="mono">${j.id}</span><${Pill} v=${j.status}/>${j.halangan&&html`<${Pill} tone="bad">Menunggu reschedule<//>`}<span style=${{marginLeft:'auto'}} className="small muted">${j.jadwal?fds(j.jadwal)+' · '+j.jam:''}</span></div><b style=${{fontSize:'15px'}}>${c.nama}</b><span className="small muted row" style=${{gap:'4px',flexWrap:'nowrap'}}>${I.pin}${c.alamat}</span><span className="small">${j.jenis}${j.rencanaUnit?' · '+j.rencanaUnit+' unit':''}</span></button>`};
  const sec=(t,items,render)=>html`<section className="stack" style=${{gap:'10px'}}><h2 style=${{fontSize:'15px'}}>${t} <span className="tcount">${items.length}</span></h2>${items.length?html`<div className="tk-list">${items.map(render)}</div>`:html`<div className="empty">Kosong.</div>`}</section>`;
  return html`
    <${PageHead} title=${'Halo, '+tekName(s,tekId).split(' ')[0]} sub=${fds(T)+' · tampilan teknisi (dibuka dari HP)'}/>
    ${sec('Hari ini',today,card)}
    ${sec('Survey saya',surveys,x=>html`<button key=${x.id} className="tk-card" onClick=${()=>go('survey-detail',x.id)}><div className="h"><span className="mono">${x.id}</span><${Pill} v="survey"/><span style=${{marginLeft:'auto'}} className="small muted">${fds(x.tgl)} · ${x.jam}</span></div><b style=${{fontSize:'15px'}}>${x.nama}</b><span className="small muted">${x.alamat}</span><span className="small">${x.ket}</span></button>`)}
    ${sec('Mendatang',next,card)}
    ${sec('Selesai 7 hari terakhir',done,card)}`;
}

          ${units.length>0&&html`<div className="divider"></div><b className="small">Unit terkait</b>${units.map(u=>html`<div key=${u.id} className="small">${u.merk} ${u.tipe} · ${u.lokasi} <span className="mono muted">${u.seri}</span></div>`)}`}</div>
      </div>
    </div>`;
}
function SurveyDetail({id}){
  const {s,act,go}=useApp();const isJob=id.startsWith('J-');
  const o=isJob?byId(s.jobs,id):byId(s.leads,id);const [h,setH]=useState(o&&o.survey?o.survey.hasil||'':'');if(!o||!o.survey)return html`<p>Survey tidak ditemukan.</p>`;
  const nama=isJob?byId(s.customers,o.customerId).nama:o.nama;const alamat=isJob?byId(s.customers,o.customerId).alamat:o.alamat;
  return html`
    <${Back} to="tugas" label="Tugas saya"/>
    <${PageHead} title=${'Survey · '+nama} sub=${html`<span className="mono">${id}</span> · ${fds(o.survey.tgl)} ${o.survey.jam||''}`} actions=${html`<${Pill} v="survey"/>`}/>
    <div className="grid2"><div className="card"><h2>Hasil survey</h2><${Field} label="Catatan lapangan" hint="Jumlah titik, kondisi listrik, jalur pipa, kebutuhan material. Admin memakainya untuk menyusun penawaran."><textarea className="input" id="sd-h" style=${{minHeight:'140px'}} value=${h} onChange=${e=>setH(e.target.value)}></textarea><//>
      <button className="btn primary lg" disabled=${!h.trim()} onClick=${()=>{act(d=>{const x=isJob?byId(d.jobs,id):byId(d.leads,id);x.survey.hasil=h},'Hasil survey terkirim ke admin');go('tugas')}}>Kirim hasil survey</button></div>
      <div className="card"><h2>Lokasi</h2><dl className="kv"><dt>Alamat</dt><dd>${alamat}</dd><dt>Kebutuhan</dt><dd>${isJob?o.catatan:o.kebutuhan}</dd>${!isJob?html`<dt>Kontak</dt><dd className="mono">${o.hp}</dd>`:''}</dl></div></div>`;
}

/* ================= APP ================= */
const NAV_ADMIN=[['dashboard','Dashboard','grid'],['alur','Alur proses','flow'],['-','Pipeline'],['lead','Lead','inbox'],['job','Job','wrench'],['kalender','Kalender teknisi','cal'],['-','Keuangan'],['tagihan','Tagihan & piutang','wallet'],['-','After-sales'],['customer','Customer & unit AC','users'],['garansi','Garansi & klaim','shield'],['reminder','Reminder servis','bell']];
const NAV_TEK=[['tugas','Tugas saya','clip'],['kalender','Kalender saya','cal'],['alur','Alur proses','flow']];
function App(){
  const [s,setS]=useState(load);
  const [role,setRole]=useState('admin');const [tekId,setTekId]=useState('T1');
  const [route,setRoute]=useState({page:'dashboard'});
  const [modal,setModal]=useState(null);const [toast,setToast]=useState(null);const [drawer,setDrawer]=useState(false);
  useEffect(()=>persist(s),[s]);
  const notify=m=>{setToast(m);clearTimeout(window.__tt);window.__tt=setTimeout(()=>setToast(null),2800)};
  const act=(fn,msg)=>{setS(p=>{const d=structuredClone(p);fn(d);return d});if(msg)notify(msg)};
  const go=(page,id)=>{setRoute({page,id});setDrawer(false);window.scrollTo(0,0)};
  const switchRole=r=>{setRole(r);go(r==='teknisi'?'tugas':'dashboard')};
  const ctx={s,act,go,role,tekId,notify,openModal:setModal,closeModal:()=>setModal(null)};
  const nav=role==='teknisi'?NAV_TEK:NAV_ADMIN;
  const parent={'lead-detail':'lead','job-detail':'job','customer-detail':'customer','tugas-detail':'tugas','survey-detail':'tugas'}[route.page]||route.page;
  const badges={lead:s.leads.filter(l=>l.status==='baru').length,tagihan:s.jobs.filter(overdue24).length,garansi:s.klaim.filter(k=>k.status==='diajukan').length,reminder:reminderUnits(s).filter(u=>!openJobFor(s,u.customerId)&&!(s.reminderLog[u.customerId]&&s.reminderLog[u.customerId].status==='ditolak')).length,
    job:s.jobs.filter(j=>j.halangan).length,tugas:s.jobs.filter(j=>j.teknisi.includes(tekId)&&(j.status==='proses'||(j.jadwal===T&&j.status==='terjadwal'))).length};
  const P={dashboard:Dashboard,alur:Alur,lead:LeadList,'lead-detail':LeadDetail,job:JobList,'job-detail':JobDetail,kalender:Kalender,tagihan:Tagihan,customer:CustomerList,'customer-detail':CustomerDetail,garansi:Garansi,reminder:Reminder,tugas:TugasSaya,'tugas-detail':TugasDetail,'survey-detail':SurveyDetail}[route.page]||Dashboard;
  return html`<${Ctx.Provider} value=${ctx}><div className="app">
    <aside className=${'side'+(drawer?' open':'')}>
      <div className="brand"><span className="brand-mark">${I.snow}</span><div><b>Sehawa</b><span>Operasional internal</span></div></div>
      ${nav.map((n,i)=>n[0]==='-'?html`<div key=${i} className="nav-sep">${n[1]}</div>`:html`<button key=${n[0]} className=${'nav'+(parent===n[0]?' on':'')} onClick=${()=>go(n[0])}>${I[n[2]]}<span>${n[1]}</span>${badges[n[0]]?html`<span className="badge">${badges[n[0]]}</span>`:''}</button>`)}
      <div className="side-foot"><span className="small muted">Data contoh tersimpan di browser ini dan kembali ke awal setiap hari.</span><button className="btn sm" onClick=${()=>{setS(seed());go(role==='teknisi'?'tugas':'dashboard');notify('Data contoh dikembalikan ke awal')}}>Reset data contoh</button></div>
    </aside>
    <div className=${'scrim'+(drawer?' open':'')} onClick=${()=>setDrawer(false)}></div>
    <div className="main">
      <header className="top">
        <button className="icon-btn menu-btn" aria-label="Buka menu" onClick=${()=>setDrawer(true)}>${I.menu}</button>
        <span className="proto">Prototipe</span>
        <div className="role-wrap"><span className="small muted">Lihat sebagai</span><${Seg} value=${role} onChange=${switchRole} options=${[['admin','Admin'],['teknisi','Teknisi'],['owner','Owner']]}/>
          ${role==='teknisi'&&html`<select className="input" style=${{width:'auto',padding:'5px 10px'}} id="tek-sel" aria-label="Pilih teknisi" value=${tekId} onChange=${e=>{setTekId(e.target.value);go('tugas')}}>${s.teknisi.map(t=>html`<option key=${t.id} value=${t.id}>${t.nama}</option>`)}</select>`}</div>
      </header>
      <main className="content"><${P} key=${route.page+(route.id||'')} id=${route.id}/></main>
    </div>
    ${modal&&html`<${Modal} title=${modal.title} wide=${modal.wide} onClose=${()=>setModal(null)}>${modal.body}<//>`}
    ${toast&&html`<div className="toast" role="status">${I.check}${toast}</div>`}
  </div><//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
